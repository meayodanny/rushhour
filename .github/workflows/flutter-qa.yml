name: Flutter QA

on:
  push:
    branches: ['arena/c208a14e-rushhour', main']
  workflow_dispatch:

jobs:
  analyze-test-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        id: analyze
        run: |
          mkdir -p qa_logs
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee qa_logs/analyze.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Test (regenerating QA goldens)
        id: test
        if: always()
        run: |
          set +e
          flutter test --update-goldens --reporter expanded 2>&1 | tee qa_logs/test.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Assemble evidence GIF
        if: always()
        run: |
          set +e
          python3 -m pip install --user pillow
          python3 tools/make_evidence_gif.py 2>&1 | tee qa_logs/gif.log

      - name: Commit & push QA evidence and logs
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add qa_logs test/goldens docs/qa
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "QA: logs and evidence artifacts [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi

      - name: Fail if analyze or test failed
        if: always()
        run: |
          if [ "${{ steps.analyze.outputs.exit }}" != "0" ]; then
            echo "flutter analyze failed — see qa_logs/analyze.log"
            exit 1
          fi
          if [ "${{ steps.test.outputs.exit }}" != "0" ]; then
            echo "flutter test failed — see qa_logs/test.log"
            exit 1
          fi
