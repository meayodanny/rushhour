name: Flutter QA

on:
  push:
    branches: ['arena/c208a14e-rushhour', main']
  workflow_dispatch:

jobs:
  analyze-test-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: |
          mkdir -p qa_logs
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee qa_logs/analyze.txt

      - name: Test (regenerating QA goldens)
        if: always()
        run: |
          set -o pipefail
          flutter test --update-goldens --reporter expanded 2>&1 | tee qa_logs/test.txt

      - name: Assemble evidence GIF
        if: always()
        run: |
          set +e
          python3 -m pip install --user pillow 2>&1 | tee -a qa_logs/gif.txt
          python3 tools/make_evidence_gif.py 2>&1 | tee -a qa_logs/gif.txt
          echo "gif_exit=$?" | tee -a qa_logs/gif.txt

      - name: Commit & push QA evidence and logs
        if: always()
        run: |
          {
            echo "=== workspace listing ==="
            ls -la
            echo "=== all png files ==="
            find . -name '*.png' -not -path './.git/*' -not -path './build/*' | head -50
            echo "=== test dir ==="
            ls -la test test/goldens 2>&1 || true
            echo "=== test log tail ==="
            tail -40 qa_logs/test.txt 2>&1 || true
            echo "=== gitignore check ==="
            git check-ignore -v test/goldens/hitbox_map.png qa_logs/test.txt 2>&1 || true
          } > qa_logs/workspace.txt 2>&1
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          for p in qa_logs test/goldens docs/qa; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "QA: logs and evidence artifacts [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
